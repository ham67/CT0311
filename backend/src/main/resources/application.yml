server:
  port: 9000

spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/sso_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      validation-query: SELECT 1
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  sql:
    init:
      mode: always
      schema-locations:
        - classpath:sql/schema-security.sql
        - classpath:sql/schema-business.sql

kms:
  endpoint: http://localhost:8088
  token: demo-kms-token

risk-control:
  whitelist-ips: []
  blacklist-ips:
    - 10.10.10.10

logging:
  level:
    org.springframework.security: info
